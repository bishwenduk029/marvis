[workspace]
resolver = "2"
members = [
    "core/common",
    "core/stt",
    "core/tts",
    "core/harness",
    "core/engine",
    "core/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
sherpa-onnx = "1.13.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
